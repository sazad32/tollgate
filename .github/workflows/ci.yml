name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, format and test
    runs-on: ubuntu-latest
    # A real Postgres for billing's ledger tests: ON CONFLICT is the exactly-once guarantee, so it's
    # tested on the real thing. Same image as deploy/postgres.
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TOLLGATE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes exact tags only, no floating v10
        with:
          version: "0.13.6" # keep in step with the local uv (uv --version)

      - name: Install workspace
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
