name: Image

# Builds one Tollgate image and pushes it to GitHub Container Registry (ADR 0009). Called by
# gateway-image.yml and billing-image.yml, each with its own path filter, so a change builds only
# the image it touches. .NET: a shared pipeline template, like an Azure Pipelines `template:`.
on:
  workflow_call:
    inputs:
      name:
        description: "The package: gateway or billing. Builds <name>/Dockerfile as tollgate-<name>."
        required: true
        type: string

permissions:
  contents: read
  packages: write # push to ghcr.io with the workflow's own token; no personal access token

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Docker's actions publish exact tags; pinned like setup-uv in ci.yml.
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tollgate-${{ inputs.name }}
          # sha-<commit> on every build (what deploy/ pins); `main` on the default branch.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ inputs.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per image, so the two builds don't overwrite each other's layers.
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}
