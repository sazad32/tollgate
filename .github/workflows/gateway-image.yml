name: Gateway image

# Builds the gateway image and pushes it to GitHub Container Registry (ADR 0009).
# Feature branches build too, so a change can be deployed to the cluster before it's merged.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - gateway/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/gateway-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io with the workflow's own token; no personal access token

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Docker's actions publish exact tags; pinned like setup-uv in ci.yml.
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tollgate-gateway
          # sha-<commit> on every build (what deploy/gateway pins); `main` on the default branch.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
