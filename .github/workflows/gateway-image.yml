name: Gateway image

# Builds the gateway image (ADR 0009) with the shared image.yml.
# Feature branches build too, so a change can be deployed to the cluster before it's merged.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - gateway/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/gateway-image.yml
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      name: gateway
