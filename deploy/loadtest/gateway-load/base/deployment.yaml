# A second gateway, only for load tests (ADR 0019): the same image and the same Redis and Postgres as
# deploy/gateway, but its only backend is the fake model server, and the `loadtest` tier has a rate
# limit high enough not to get in the way. The production gateway isn't touched, and its Service
# doesn't select these pods (another name label).
# Usage events go to the real stream and ledger as tenant `loadtest`, model `mock-model` (priced at
# 0.00 in deploy/billing/prices.toml), so billing's throughput is part of the test.
# The pod template only: ../node-1 and ../node-2 make one Deployment per node from it, with that
# node's number of gateway processes (one per pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tollgate-gateway-load
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate-gateway-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tollgate-gateway-load
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: tollgate
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Keep in step with deploy/gateway/deployment.yaml.
          image: ghcr.io/sazad32/tollgate-gateway:sha-d9658d5@sha256:861575b15e8449831b79bc58aa707cc78926e4139db6ce7b7db39c226e08d4a3
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            # TOLLGATE_API_KEY_PEPPER and TOLLGATE_DATABASE_URL: the same tenants and keys.
            - secretRef:
                name: gateway-auth
          env:
            - name: TOLLGATE_BACKENDS
              value: '[{"name": "mock", "url": "http://tollgate-mock.tollgate.svc.cluster.local.:8080", "kind": "llama", "slots": 5000, "priority": 0}]'
            - name: TOLLGATE_LOCAL_MODEL
              value: mock-model
            - name: TOLLGATE_RATE_LIMITS
              value: '{"standard": 10000, "loadtest": 1000000000}'
            - name: TOLLGATE_FAIR_QUEUE
              value: "true" # the queue still runs, in Redis, on every request; 5000 slots never fill
            - name: TOLLGATE_MAX_IN_FLIGHT
              value: "300" # one process saturates near 300 streams: past it, a quick 503 (ADR 0020)
            - name: TOLLGATE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: TOLLGATE_REDIS_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources: # as in production
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi # thousands of open streams fit (ADR 0020); TOLLGATE_MAX_IN_FLIGHT caps them
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
