# Postgres data on node-2's data disk (ADR 0006, ADR 0011). Pins Postgres to node-2.
# One-time, needs sudo on vps-node-2. Postgres runs as user and group 999:
#   sudo mkdir -p /mnt/storage/tollgate/postgres && sudo chown 999:999 /mnt/storage/tollgate/postgres
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tollgate-postgres-vps-node-2
  labels:
    app.kubernetes.io/part-of: tollgate
    tollgate/purpose: postgres
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: tollgate-local
  local:
    path: /mnt/storage/tollgate/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [vps-node-2]
