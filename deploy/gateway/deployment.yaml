# The gateway: stateless, CPU only, 2 replicas spread over the nodes (ADR 0009).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tollgate-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # always keep serving during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tollgate-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: tollgate
    spec:
      # One replica per node, so losing a node leaves one running. A hard rule: as a mere preference
      # (ScheduleAnyway) the scheduler put both on node-2 once Keycloak took memory on node-1.
      # matchLabelKeys: count only pods of the same revision. Without it the old pods count during a
      # rollout, and the week 8 rollout legally ended with both new pods on node-2.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tollgate-gateway
          matchLabelKeys:
            - pod-template-hash
      # Streams can run for minutes. A pod being replaced gets this long to finish the ones in flight.
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Built by .github/workflows/gateway-image.yml from commit 12647ff. Pinned by digest.
          image: ghcr.io/sazad32/tollgate-gateway:sha-12647ff@sha256:036a1351f84ed9f775fb71c23ee6494602aa944c71b09f1522a4757138f309e5
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tollgate-gateway-config
            # TOLLGATE_API_KEY_PEPPER and TOLLGATE_DATABASE_URL (ADR 0010). Made by hand, never in Git.
            - secretRef:
                name: gateway-auth
          env:
            # Sent to every local backend: only vLLM needs it, llama-server ignores it. Optional, so
            # the gateway starts without it.
            - name: TOLLGATE_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
                  optional: true
            # The hosted model (ADR 0013). Optional: without the Secret there is no hosted model and
            # every request stays local. Made by hand, never in Git (deploy/README.md).
            - name: TOLLGATE_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: ANTHROPIC_API_KEY
                  optional: true
            # Token buckets (ADR 0012): redis://:<password>@redis.tollgate.svc:6379/0
            - name: TOLLGATE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: TOLLGATE_REDIS_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
