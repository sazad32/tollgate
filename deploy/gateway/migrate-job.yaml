# Apply database migrations (ADR 0011), once per release, before the new gateway serves traffic.
# A Job rather than an init container: with 2 gateway replicas, two pods migrating at once would race.
# Not part of `kubectl apply -k deploy`. Run it by hand, with the same image as deployment.yaml:
#   kubectl apply -f deploy/gateway/migrate-job.yaml
#   kubectl -n tollgate wait --for=condition=complete job/gateway-migrate --timeout=2m
#   kubectl -n tollgate logs job/gateway-migrate
#   kubectl -n tollgate delete job gateway-migrate      # a Job's name can't be reused until deleted
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate
  namespace: tollgate
  labels:
    app.kubernetes.io/name: gateway-migrate
    app.kubernetes.io/part-of: tollgate
spec:
  backoffLimit: 2 # Postgres may still be starting; a migration is idempotent, so a retry is safe
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Keep in step with deploy/gateway/deployment.yaml.
          image: ghcr.io/sazad32/tollgate-gateway:sha-1c4d674@sha256:b7e3d58e09545212c8e28c759d3aaa1bc544b09d10eabb7889ae1e9f129f2494
          command: ["python", "-m", "tollgate_gateway.admin", "migrate"]
          envFrom:
            - secretRef:
                name: gateway-auth
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
