# One Postgres instance for Tollgate's own tables and Keycloak's (ADR 0011). Not highly available:
# a restart takes it away for seconds. Backups and HA are Phase 4 work.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: tollgate
    spec:
      automountServiceAccountToken: false
      # The data directory belongs to the image's postgres user (999); start as that user directly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60 # time for a clean shutdown (checkpoint), not a crash recovery
      containers:
        - name: postgres
          # Pinned by digest. 18.6 on Debian bookworm.
          image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
          envFrom:
            # POSTGRES_PASSWORD (superuser), TOLLGATE_DB_PASSWORD, KEYCLOAK_DB_PASSWORD. Made by hand.
            - secretRef:
                name: postgres-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Postgres 18's image keeps its data in /var/lib/postgresql/18/docker (PGDATA).
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: tollgate-local
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
        selector:
          matchLabels:
            tollgate/purpose: postgres
