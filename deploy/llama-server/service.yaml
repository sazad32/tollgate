# Load-balanced entry point for both replicas. Only ready pods (model loaded) receive traffic.
# In-cluster URL: http://llama-server.tollgate.svc:8080/v1
apiVersion: v1
kind: Service
metadata:
  name: llama-server
spec:
  selector:
    app.kubernetes.io/name: llama-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Headless Service: required by the StatefulSet, and gives each replica its own DNS name,
# e.g. llama-server-0.llama-server-headless.tollgate.svc. Used for per-pod metrics (week 3)
# and per-backend routing (week 8).
apiVersion: v1
kind: Service
metadata:
  name: llama-server-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: llama-server
  ports:
    - name: http
      port: 8080
      targetPort: http
