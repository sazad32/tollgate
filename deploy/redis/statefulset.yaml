# Redis for the token buckets (ADR 0012), the fair queue (ADR 0014) and the usage stream (ADR 0015).
# One instance. The usage stream must survive a restart, so Redis keeps an append-only file (AOF) on
# node-2's data disk, synced every second: a crash loses at most the last second of writes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: tollgate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the image's redis user
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Pinned by digest. 8.10.3.
          image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: REDIS_PASSWORD
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            # Durability: every write goes to the append-only file, fsynced once a second. No
            # snapshots on top (the AOF already holds everything).
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - ""
            # Hard memory cap. When full, evict only keys with an expiry (buckets, queue counters),
            # never keys without one, such as the usage stream: writing to it fails instead.
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi # 256 MB of data, plus the AOF rewrite's copy-on-write headroom
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data # Redis's working directory: the append-only file lives here
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: tollgate-local
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
        selector:
          matchLabels:
            tollgate/purpose: redis
